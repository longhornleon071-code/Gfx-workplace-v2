.avwrap .badge{right:2px;bottom:2px}
.sw{gap:12px;flex-wrap:wrap}

.pw{position:relative}.pw input{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);padding:8px;cursor:pointer;display:grid;place-items:center}

summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:'+';color:var(--b);font-size:20px;line-height:1}details[open] summary::after{content:'\2212'}
summary::-webkit-details-marker{display:none}details p{margin:10px 0 0;color:var(--mu);font-size:15px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.btn,label.up{position:relative;cursor:pointer}

.mb{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:30;padding:20px}

:root[data-theme=dark]{--bg:#0b1120;--cd:#131c31;--ink:#f1f5f9;--mu:#94a3b8;--ln:#26334d;--bl:#172554}:root[data-theme=dark] .chip.on,:root[data-theme=dark] .btn{color:#fff}:root[data-theme=dark] .tag{background:#1e293b}:root[data-theme=dark] .bar{background:#26334d}:root[data-theme=dark] .btn.o{border-color:#1e3a8a}:root[data-theme=dark] .btn.r{background:#2a1517;border-color:#5b2226}

</style>

function pageHTML(kind){
 const o=P||{},nm=esc(o.studio||o.name||'Studio'),col=o.color||COLORS[0],T=kind==='form'?(FM.title||'Order form'):'Portfolio';
 const css=`*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#0f172a}main{max-width:640px;margin:0 auto;padding:20px 16px 48px}header{display:flex;gap:14px;align-items:center;margin-bottom:14px}.av{width:64px;height:64px;border-radius:50%;object-fit:cover;color:#fff;display:grid;place-items:center;font-weight:800;font-size:26px;flex:none}h1{font-size:22px;margin:0}h2{font-size:18px;margin:24px 0 10px}h3{font-size:16px;margin:18px 0 8px}p{margin:0 0 10px;color:#475569}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin-bottom:14px}.cover{width:100%;max-height:220px;object-fit:cover;border-radius:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}figure{margin:0}figure img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px;display:block}figcaption{font-size:13px;color:#475569;margin-top:4px}.menu{display:grid;gap:8px}.menu div{display:flex;justify-content:space-between;border:1px solid #e2e8f0;border-radius:12px;padding:10px 14px;background:#fff}label{display:block;font-weight:600;font-size:14px;margin:12px 0 0}input,select,textarea{display:block;width:100%;margin-top:6px;border:1.5px solid #e2e8f0;border-radius:12px;padding:11px 13px;font:inherit;background:#fff}button{margin-top:18px;width:100%;border:0;border-radius:12px;padding:14px;background:var(--c);color:#fff;font:inherit;font-weight:700}`;
 const head=`<header>${o.avatar?`<img class="av" src="${o.avatar}" alt="">`:`<div class="av" style="background:${col}">${esc(((o.name||'G').trim()[0]||'G').toUpperCase())}</div>`}<div><h1>${nm}</h1><p style="margin:0">${esc([o.name&&o.studio?o.name:'',o.handle].filter(Boolean).join(' · '))}</p></div></header>${o.bio?`<p>${esc(o.bio)}</p>`:''}`;
 const grid=a=>`<div class="grid">${a.map(g=>`<figure><img src="${g.src}" alt="${esc(g.title)}">${g.title?`<figcaption>${esc(g.title)}</figcaption>`:''}</figure>`).join('')}</div>`;
 const oth=G.filter(g=>!g.grp||!GR.includes(g.grp));
 const art=!G.length?'<p>No artwork yet.</p>':GR.length?GR.filter(n=>G.some(g=>g.grp===n)).map(n=>`<h3>${esc(n)}</h3>${grid(G.filter(g=>g.grp===n))}`).join('')+(oth.length?`<h3>Other work</h3>${grid(oth)}`:''):grid(G);
 let body,js='';
 if(kind==='form'){
  const q=f=>{const l=esc(f.l),a=`data-q="${l}"${f.r?' required':''}`,L=`<label>${l}${f.r?' *':''}`;
   if(f.t==='textarea')return `${L}<textarea ${a} rows="4"></textarea></label>`;
   if(f.t==='menu')return `${L}<select ${a}><option value="">Choose…</option>${FM.menu.map(m=>`<option>${esc(m.n)} (${$$(m.p)})</option>`).join('')}</select></label>`;
   if(f.t==='select')return `${L}<select ${a}><option value="">Choose…</option>${String(f.o||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<option>${esc(x)}</option>`).join('')}</select></label>`;
   return `${L}<input type="${f.t==='number'?'number':f.t==='date'?'date':'text'}" ${a}></label>`};
  body=(FM.cover?`<img class="cover" src="${FM.cover}" alt="">`:'')+head+`<h2>${esc(FM.title)}</h2><p>${esc(FM.intro)}</p>`+(FM.menu.length?`<h2>Commission menu</h2><div class="menu">${FM.menu.map(m=>`<div><b>${esc(m.n)}</b><span>${$$(m.p)}</span></div>`).join('')}</div>`:'')+`<h2>Your details</h2><form id="f" class="card">${FM.fields.map(q).join('')}<button type="submit">${esc(FM.btn||'Send order')}</button></form>`+(G.length?`<h2>My work</h2>${art}`:'');
  const em=JSON.stringify(o.email||'').replace(/</g,'\\u003c'),tt=JSON.stringify(FM.title||'Order').replace(/</g,'\\u003c');
  js=`var E=${em},T=${tt};document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault();var L=[];document.querySelectorAll('[data-q]').forEach(function(e){L.push(e.getAttribute('data-q')+': '+e.value.trim())});var b=L.join(String.fromCharCode(10));if(E){location.href='mailto:'+E+'?subject='+encodeURIComponent(T)+'&body='+encodeURIComponent(b)}else if(navigator.share){navigator.share({title:T,text:b}).catch(function(){})}else{if(navigator.clipboard)navigator.clipboard.writeText(b);alert('Order details copied. Send them to the artist.')}});`;
 }else body=head+`<h2>Portfolio</h2>${art}`;
 return '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(T)+' · '+nm+'</title><style>'+css+'</style></head><body style="--c:'+col+'"><main>'+body+'</main>'+(js?'<script>'+js+'<\/script>':'')+'</body></html>'}

 m.innerHTML='<div class="md sh"><p>Add photo</p>'+'<label class="opt"><input class="ovl" type="file" accept="image/*" capture="environment">'+ic('cam')+'Take photo</label><label class="opt"><input class="ovl" type="file" accept="image/*"'+(multi?' multiple':'')+'>'+ic('img')+'Choose from gallery</label><button class="btn o w" data-s="x">Cancel</button></div>';

 let n=0;for(const f of fs){try{const src=await shrink(f,k==='port'?1280:900,.75);if(k==='port'){G.push({src,th:await shrink(f,360,.7),title:'',grp:U.grp!=='All'?U.grp:''})}else D[k].push({src,th:src});n++}catch(e){}}

 toast(n+' photo'+(n>1?'s':'')+' added.')}

 go:t=>go(t.dataset.v),prof:()=>go('profile'),new:()=>go('new'),queue:()=>go('queue'),addphoto:t=>photoSheet(t.dataset.k),

 const k=t.dataset.up;if(!k)return;
 for(const f of [...t.files]){try{const s=await shrink(f);if(k==='avatar')PF.avatar=s;else if(k==='port'){G.push(s)}else D[k].push(s)}catch(x){toast('Could not read that photo. Try a JPG or PNG.')}}
 t.value='';
 if(k==='port'){sv('g2_port',G);render()}
 else if(k==='avatar'){const b=$('#pbig');if(b)b.innerHTML=`<img src="${PF.avatar}" alt="">`}
 else{const w=$('#t_'+k);if(w)w.innerHTML=thumbs(k)}
});
addEventListener('error',e=>toast('Error: '+e.message));
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const t=e.target;if(t.id==='lpw')A.unlock();else if(t.dataset&&(t.dataset.p==='password'||(t.dataset.p==='name'&&!P)))A.start()});
render();
